# 与 Java 版 base-test-toolkit 共用同一套件格式（testDataSuite/cases）。
# Java 用 Jackson 解析，Python 用 PyYAML 解析，字段名保持一致：
# mockId / extraParams / debugCases。
testDataSuite:
  description: Quick start demo - order creation suite
  cases:
    - name: apply coupon discount
      enabled: true
      thought: coupon SAVE20 reduces total by 20
      users:
        - reviewer
      mockId: inventory-ok
      request:
        - order-coupon-request.json
      expect:
        - order-coupon-response.json
      extraParams:
        channel: web
    - name: full price without coupon
      enabled: true
      thought: orders without coupon keep full price
      users:
        - reviewer
      request:
        - order-fullprice-request.json
      expect:
        - order-fullprice-response.json
    - name: disabled example
      enabled: false
      thought: disabled cases are filtered out by load_test_data
      request:
        - order-coupon-request.json
      expect:
        - order-coupon-response.json
